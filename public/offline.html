<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c55d5">
  <title>You're offline · Multiply!</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6f5ff; color: #262044; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 64px; height: 58px; margin-bottom: 28px; }
    h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
    p { color: #706983; line-height: 1.6; }
    button { margin-top: 16px; border: 0; border-radius: 16px; padding: 16px 28px; background: #5c55d5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #262044; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/multiply-logo.svg" alt="Multiply!">
    <h1>You're offline</h1>
    <p>Connect to the internet to load your family and keep practicing. Any games waiting to save are still on this device.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
