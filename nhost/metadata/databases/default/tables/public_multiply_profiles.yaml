# Legacy data remains available to its owner for recovery. All gameplay writes
# now use multiply_family_action; old full-profile writes must stop at rollout.
table:
  name: multiply_profiles
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - data
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
