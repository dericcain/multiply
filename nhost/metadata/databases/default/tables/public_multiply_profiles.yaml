table:
  name: multiply_profiles
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - data
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - data
update_permissions:
  - role: user
    permission:
      columns:
        - data
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
